<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#12121a">
<title>Rhythm Tap Memo — リズムメモ</title>
<style>
  :root {
    --bg: #12121a;
    --surface: #1c1c28;
    --surface2: #262636;
    --text: #ececf4;
    --text-dim: #9a9ab0;
    --accent: #7c6cf6;
    --accent-soft: #7c6cf633;
    --danger: #f66c8a;
    --ok: #5fd4a2;
    --radius: 14px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f4f8;
      --surface: #ffffff;
      --surface2: #ebebf2;
      --text: #22222e;
      --text-dim: #6a6a80;
      --accent: #6a58e8;
      --accent-soft: #6a58e822;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    max-width: 560px;
    margin: 0 auto;
    padding: 12px;
    gap: 10px;
    overscroll-behavior: none;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  header h1 { font-size: 17px; font-weight: 700; letter-spacing: .02em; }
  header .toggles { display: flex; gap: 6px; }
  .toggle {
    border: 1px solid var(--surface2);
    background: var(--surface);
    color: var(--text-dim);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
  }
  .toggle.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

  /* ---- tap pad ---- */
  #pad {
    position: relative;
    flex: 1;
    min-height: 220px;
    background: var(--surface);
    border: 2px solid var(--surface2);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    transition: background .08s, border-color .15s;
    overflow: hidden;
  }
  #pad.recording { border-color: var(--danger); }
  #pad.pressed { background: var(--accent-soft); }
  #padLabel { font-size: 18px; font-weight: 600; pointer-events: none; }
  #padSub { font-size: 13px; color: var(--text-dim); pointer-events: none; text-align: center; line-height: 1.6; padding: 0 16px;}
  #recDot {
    position: absolute; top: 12px; left: 14px;
    display: none; align-items: center; gap: 6px;
    font-size: 13px; color: var(--danger); font-weight: 600;
    pointer-events: none;
  }
  #pad.recording #recDot { display: flex; }
  #recDot::before {
    content: ""; width: 10px; height: 10px; border-radius: 50%;
    background: var(--danger);
    animation: blink 1s infinite;
  }
  @keyframes blink { 50% { opacity: .25; } }
  #elapsed {
    position: absolute; top: 12px; right: 14px;
    font-size: 13px; color: var(--text-dim);
    font-variant-numeric: tabular-nums;
    pointer-events: none;
  }
  .ripple {
    position: absolute;
    border-radius: 50%;
    background: var(--accent);
    opacity: .35;
    transform: translate(-50%, -50%) scale(0);
    animation: ripple .5s ease-out forwards;
    pointer-events: none;
  }
  @keyframes ripple { to { transform: translate(-50%, -50%) scale(1); opacity: 0; } }

  /* ---- controls ---- */
  .row { display: flex; gap: 8px; }
  button.btn {
    flex: 1;
    border: none;
    border-radius: var(--radius);
    padding: 14px 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    background: var(--surface2);
    color: var(--text);
    user-select: none;
    -webkit-user-select: none;
  }
  button.btn:disabled { opacity: .35; cursor: default; }
  button.btn.primary { background: var(--accent); color: #fff; }
  button.btn.danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); }

  /* ---- timeline ---- */
  #timelineWrap {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 12px;
    display: none;
    flex-direction: column;
    gap: 8px;
  }
  #timelineWrap.show { display: flex; }
  #timelineInfo { font-size: 13px; color: var(--text-dim); display: flex; justify-content: space-between; }
  #timeline {
    position: relative;
    height: 44px;
    background: var(--surface2);
    border-radius: 8px;
    overflow: hidden;
  }
  #timeline .note {
    position: absolute;
    top: 8px; bottom: 8px;
    min-width: 5px;
    border-radius: 4px;
    background: var(--accent);
    opacity: .85;
    transition: background .05s;
  }
  #timeline .note.hit { background: var(--ok); }
  #timeline #cursor {
    position: absolute; top: 0; bottom: 0; width: 2px;
    background: var(--text);
    opacity: .6;
    display: none;
  }
  .speedRow { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-dim); }
  .speedRow input[type=range] { flex: 1; accent-color: var(--accent); }

  /* ---- saved list ---- */
  #savedSection h2 { font-size: 14px; color: var(--text-dim); font-weight: 600; margin-bottom: 8px; }
  #savedList { display: flex; flex-direction: column; gap: 8px; max-height: 32vh; overflow-y: auto; }
  .memo {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .memo .meta { flex: 1; min-width: 0; }
  .memo .name { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .memo .sub { font-size: 12px; color: var(--text-dim); }
  .memo button {
    border: none; background: var(--surface2); color: var(--text);
    border-radius: 8px; width: 38px; height: 38px; font-size: 16px; cursor: pointer;
    flex-shrink: 0;
  }
  .memo button.del { color: var(--danger); background: transparent; }
  #emptyMsg { font-size: 13px; color: var(--text-dim); text-align: center; padding: 12px 0; }
  .exportRow { display: flex; gap: 8px; margin-top: 8px; }
  .exportRow button {
    flex: 1; border: 1px solid var(--surface2); background: transparent;
    color: var(--text-dim); border-radius: 10px; padding: 9px; font-size: 13px; cursor: pointer;
  }
  #toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--surface2); color: var(--text);
    padding: 10px 18px; border-radius: 999px; font-size: 13px;
    transition: transform .25s; z-index: 50;
    box-shadow: 0 4px 16px #0006;
    white-space: nowrap;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <h1>🥁 リズムメモ</h1>
  <div class="toggles">
    <div class="toggle on" id="soundToggle">🔊 音</div>
    <div class="toggle" id="vibToggle">📳 振動</div>
  </div>
</header>

<div id="pad">
  <div id="recDot">REC</div>
  <div id="elapsed"></div>
  <div id="padLabel">ここをタップ</div>
  <div id="padSub">最初のタップで記録がはじまります。<br>思いついたリズムのとおりに叩いてください。<br>長押しすると「長い音」として残ります。</div>
</div>

<div class="row">
  <button class="btn danger" id="stopBtn" disabled>■ 記録おわり</button>
</div>

<div id="timelineWrap">
  <div id="timelineInfo">
    <span id="tlStats"></span>
    <span id="tlBpm"></span>
  </div>
  <div id="timeline"><div id="cursor"></div></div>
  <div class="speedRow">
    <span>再生速度</span>
    <input type="range" id="speed" min="50" max="150" value="100" step="5">
    <span id="speedVal">1.0x</span>
  </div>
  <div class="row">
    <button class="btn primary" id="playBtn">▶ 再生</button>
    <button class="btn" id="saveBtn">💾 保存</button>
    <button class="btn" id="discardBtn">✕ 破棄</button>
  </div>
</div>

<div id="savedSection">
  <h2>保存したリズム</h2>
  <div id="savedList"></div>
  <div id="emptyMsg">まだ保存されたリズムはありません</div>
  <div class="exportRow">
    <button id="exportBtn">⬇ 全部書き出し (JSON)</button>
    <button id="importBtn">⬆ 読み込み</button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
  </div>
</div>

<div id="toast"></div>

<script>
(() => {
  "use strict";

  // ---------- state ----------
  const LS_KEY = "rhythm-tap-memos-v1";
  let recording = false;
  let recStart = 0;          // performance.now() at first tap
  let notes = [];            // {t: onset ms, d: duration ms}
  let activePointers = new Map(); // pointerId -> note index
  let elapsedTimer = null;
  let current = null;        // finished take: {notes, total}
  let playToken = 0;         // increments to cancel playback
  let audioCtx = null;

  const $ = id => document.getElementById(id);
  const pad = $("pad"), padLabel = $("padLabel"), padSub = $("padSub");
  const stopBtn = $("stopBtn"), elapsedEl = $("elapsed");
  const tlWrap = $("timelineWrap"), tl = $("timeline"), cursor = $("cursor");
  const soundToggle = $("soundToggle"), vibToggle = $("vibToggle");

  let soundOn = true;
  let vibOn = "vibrate" in navigator;
  vibToggle.classList.toggle("on", vibOn);
  if (!("vibrate" in navigator)) vibToggle.style.display = "none";

  // ---------- audio ----------
  function ensureAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
  // short percussive "tap" sound; longer notes sustain a soft tone
  function beep(when, durMs) {
    if (!soundOn) return;
    const ctx = ensureAudio();
    const t = Math.max(when, ctx.currentTime);
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const sustain = Math.min(Math.max(durMs / 1000, 0.06), 1.2);
    osc.type = "triangle";
    osc.frequency.setValueAtTime(660, t);
    osc.frequency.exponentialRampToValueAtTime(440, t + 0.05);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.5, t + 0.005);
    gain.gain.exponentialRampToValueAtTime(0.12, t + 0.06);
    gain.gain.setValueAtTime(0.12, t + Math.max(sustain - 0.05, 0.06));
    gain.gain.exponentialRampToValueAtTime(0.0001, t + sustain);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t);
    osc.stop(t + sustain + 0.05);
  }
  function vibrate(ms) {
    if (vibOn && navigator.vibrate) navigator.vibrate(ms);
  }

  // ---------- toggles ----------
  soundToggle.addEventListener("click", () => {
    soundOn = !soundOn;
    soundToggle.classList.toggle("on", soundOn);
    soundToggle.textContent = soundOn ? "🔊 音" : "🔇 消音";
    if (soundOn) ensureAudio();
  });
  vibToggle.addEventListener("click", () => {
    vibOn = !vibOn;
    vibToggle.classList.toggle("on", vibOn);
    if (vibOn) vibrate(30);
  });

  // ---------- recording ----------
  function startRecording(now) {
    recording = true;
    recStart = now;
    notes = [];
    pad.classList.add("recording");
    padLabel.textContent = "記録中…";
    padSub.textContent = "リズムに合わせてタップ / 長押し";
    stopBtn.disabled = false;
    hideTake();
    elapsedTimer = setInterval(() => {
      elapsedEl.textContent = ((performance.now() - recStart) / 1000).toFixed(1) + "s";
    }, 100);
  }

  function stopRecording() {
    if (!recording) return;
    recording = false;
    clearInterval(elapsedTimer);
    elapsedEl.textContent = "";
    pad.classList.remove("recording");
    padLabel.textContent = "ここをタップ";
    padSub.innerHTML = "最初のタップで記録がはじまります。<br>思いついたリズムのとおりに叩いてください。<br>長押しすると「長い音」として残ります。";
    stopBtn.disabled = true;
    // close any still-held notes
    const now = performance.now();
    for (const idx of activePointers.values()) {
      if (notes[idx] && notes[idx].d < 0) notes[idx].d = Math.round(now - recStart - notes[idx].t);
    }
    activePointers.clear();
    if (notes.length === 0) return;
    const last = notes[notes.length - 1];
    const total = last.t + Math.max(last.d, 100) + 300; // small tail
    current = { notes: notes.map(n => ({ t: n.t, d: Math.max(n.d, 30) })), total };
    showTake(current);
  }

  pad.addEventListener("pointerdown", e => {
    e.preventDefault();
    ensureAudio(); // unlock audio inside user gesture (iOS)
    const now = performance.now();
    if (!recording) startRecording(now);
    const t = Math.round(now - recStart);
    notes.push({ t, d: -1 });
    activePointers.set(e.pointerId, notes.length - 1);
    pad.classList.add("pressed");
    beep(0, 60);
    vibrate(15);
    // ripple
    const r = document.createElement("div");
    r.className = "ripple";
    const rect = pad.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height) * 0.5;
    r.style.width = r.style.height = size + "px";
    r.style.left = (e.clientX - rect.left) + "px";
    r.style.top = (e.clientY - rect.top) + "px";
    pad.appendChild(r);
    setTimeout(() => r.remove(), 550);
  });

  function releasePointer(e) {
    const idx = activePointers.get(e.pointerId);
    if (idx === undefined) return;
    activePointers.delete(e.pointerId);
    if (recording && notes[idx]) {
      notes[idx].d = Math.round(performance.now() - recStart - notes[idx].t);
    }
    if (activePointers.size === 0) pad.classList.remove("pressed");
  }
  window.addEventListener("pointerup", releasePointer);
  window.addEventListener("pointercancel", releasePointer);
  pad.addEventListener("contextmenu", e => e.preventDefault());

  // space key on desktop
  window.addEventListener("keydown", e => {
    if (e.code === "Space" && !e.repeat && e.target === document.body) {
      e.preventDefault();
      pad.dispatchEvent(new PointerEvent("pointerdown", { pointerId: -99, clientX: 0, clientY: 0 }));
    }
  });
  window.addEventListener("keyup", e => {
    if (e.code === "Space") releasePointer({ pointerId: -99 });
  });

  stopBtn.addEventListener("click", stopRecording);

  // ---------- take preview ----------
  function fmtDur(ms) { return (ms / 1000).toFixed(1) + "秒"; }

  function estimateBpm(ns) {
    if (ns.length < 3) return null;
    const iois = [];
    for (let i = 1; i < ns.length; i++) iois.push(ns[i].t - ns[i - 1].t);
    iois.sort((a, b) => a - b);
    let med = iois[Math.floor(iois.length / 2)];
    if (med <= 0) return null;
    let bpm = 60000 / med;
    while (bpm > 200) bpm /= 2;
    while (bpm < 50) bpm *= 2;
    return Math.round(bpm);
  }

  function renderTimeline(take) {
    tl.querySelectorAll(".note").forEach(el => el.remove());
    for (const n of take.notes) {
      const el = document.createElement("div");
      el.className = "note";
      el.style.left = (n.t / take.total * 100) + "%";
      el.style.width = Math.max(n.d / take.total * 100, 1.2) + "%";
      tl.appendChild(el);
    }
  }

  function showTake(take) {
    renderTimeline(take);
    $("tlStats").textContent = `${take.notes.length}打 / ${fmtDur(take.total)}`;
    const bpm = estimateBpm(take.notes);
    $("tlBpm").textContent = bpm ? `テンポ目安: ♩≈${bpm}` : "";
    tlWrap.classList.add("show");
  }
  function hideTake() {
    tlWrap.classList.remove("show");
    stopPlayback();
    current = null;
  }

  // ---------- playback ----------
  const speedInput = $("speed"), speedVal = $("speedVal");
  speedInput.addEventListener("input", () => {
    speedVal.textContent = (speedInput.value / 100).toFixed(2).replace(/0$/, "") + "x";
  });

  function stopPlayback() {
    playToken++;
    cursor.style.display = "none";
    $("playBtn").textContent = "▶ 再生";
    tl.querySelectorAll(".note").forEach(el => el.classList.remove("hit"));
  }

  function play(take) {
    stopPlayback();
    const token = playToken;
    const rate = speedInput.value / 100;
    const ctx = ensureAudio();
    const t0 = ctx.currentTime + 0.12;
    const noteEls = tl.querySelectorAll(".note");
    $("playBtn").textContent = "■ 停止";
    cursor.style.display = "block";

    take.notes.forEach((n, i) => {
      beep(t0 + n.t / 1000 / rate, n.d / rate);
      setTimeout(() => {
        if (token !== playToken) return;
        vibrate(Math.min(n.d / rate, 200));
        if (noteEls[i]) {
          noteEls[i].classList.add("hit");
          setTimeout(() => noteEls[i] && noteEls[i].classList.remove("hit"), Math.max(n.d / rate, 120));
        }
      }, 120 + n.t / rate);
    });

    const totalMs = take.total / rate;
    const startMs = performance.now() + 120;
    (function tick() {
      if (token !== playToken) return;
      const p = (performance.now() - startMs) / totalMs;
      if (p >= 1) { stopPlayback(); return; }
      if (p >= 0) cursor.style.left = (p * 100) + "%";
      requestAnimationFrame(tick);
    })();
  }

  $("playBtn").addEventListener("click", () => {
    if ($("playBtn").textContent.startsWith("■")) { stopPlayback(); return; }
    if (current) play(current);
  });
  $("discardBtn").addEventListener("click", hideTake);

  // ---------- storage ----------
  function loadMemos() {
    try { return JSON.parse(localStorage.getItem(LS_KEY)) || []; }
    catch { return []; }
  }
  function saveMemos(list) {
    localStorage.setItem(LS_KEY, JSON.stringify(list));
  }

  $("saveBtn").addEventListener("click", () => {
    if (!current) return;
    const now = new Date();
    const def = `${now.getMonth() + 1}/${now.getDate()} ${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")} のリズム`;
    const name = (prompt("名前をつけて保存", def) || "").trim() || def;
    const list = loadMemos();
    list.unshift({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      name,
      createdAt: now.toISOString(),
      notes: current.notes,
      total: current.total
    });
    saveMemos(list);
    renderSaved();
    hideTake();
    toast("保存しました 🎉");
  });

  function renderSaved() {
    const list = loadMemos();
    const wrap = $("savedList");
    wrap.innerHTML = "";
    $("emptyMsg").style.display = list.length ? "none" : "block";
    for (const m of list) {
      const row = document.createElement("div");
      row.className = "memo";
      const bpm = estimateBpm(m.notes);
      row.innerHTML = `
        <div class="meta">
          <div class="name"></div>
          <div class="sub">${m.notes.length}打 / ${fmtDur(m.total)}${bpm ? " / ♩≈" + bpm : ""}</div>
        </div>
        <button class="playOne" title="再生">▶</button>
        <button class="del" title="削除">🗑</button>`;
      row.querySelector(".name").textContent = m.name;
      row.querySelector(".playOne").addEventListener("click", () => {
        current = { notes: m.notes, total: m.total };
        showTake(current);
        play(current);
      });
      row.querySelector(".del").addEventListener("click", () => {
        if (!confirm(`「${m.name}」を削除しますか?`)) return;
        saveMemos(loadMemos().filter(x => x.id !== m.id));
        renderSaved();
      });
      wrap.appendChild(row);
    }
  }

  // ---------- import / export ----------
  $("exportBtn").addEventListener("click", () => {
    const list = loadMemos();
    if (!list.length) { toast("保存されたリズムがありません"); return; }
    const blob = new Blob([JSON.stringify({ app: "rhythm-tap", version: 1, memos: list }, null, 2)],
      { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "rhythm-memos.json";
    a.click();
    URL.revokeObjectURL(a.href);
  });
  $("importBtn").addEventListener("click", () => $("importFile").click());
  $("importFile").addEventListener("change", async e => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      const memos = Array.isArray(data) ? data : data.memos;
      if (!Array.isArray(memos)) throw new Error("bad format");
      const list = loadMemos();
      const ids = new Set(list.map(m => m.id));
      let added = 0;
      for (const m of memos) {
        if (!m || !Array.isArray(m.notes)) continue;
        if (ids.has(m.id)) continue;
        list.push(m);
        added++;
      }
      list.sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || ""));
      saveMemos(list);
      renderSaved();
      toast(`${added}件読み込みました`);
    } catch {
      toast("読み込めないファイルです");
    }
    e.target.value = "";
  });

  // ---------- toast ----------
  let toastTimer = null;
  function toast(msg) {
    const el = $("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
  }

  renderSaved();
})();
</script>
</body>
</html>
